<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>二壮</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: linear-gradient(175deg, #f0ecfc 0%, #faf8ff 30%, #fff5f7 60%, #fafaf7 100%);
    background-attachment: fixed;
    color: #4a4a5a;
    font-family: "PingFang SC","Noto Sans SC",-apple-system,sans-serif;
    min-height: 100vh; overflow-x: hidden;
  }

  /* Floating cute elements */
  .floaties {
    position: fixed; top:0; left:0; width:100%; height:100%;
    pointer-events:none; z-index:0;
  }
  .floaty {
    position: absolute; font-size: 24px;
    animation: floatUp var(--dur) ease-in infinite;
    animation-delay: var(--delay);
    opacity: 0;
  }
  @keyframes floatUp {
    0% { transform: translateY(0) rotate(0deg) scale(0.5); opacity:0; }
    10% { opacity:0.7; }
    80% { opacity:0.5; }
    100% { transform: translateY(-100vh) rotate(var(--rot)) scale(1.2); opacity:0; }
  }

  .main {
    position: relative; z-index:1; max-width: 560px; margin:0 auto;
    padding: 40px 24px 80px;
  }

  /* Character area */
  .character {
    text-align: center; margin-bottom: 20px;
    position: relative;
  }
  .char-face {
    font-size: 72px; line-height: 1; display: block;
    transition: all 0.4s cubic-bezier(0.34,1.56,0.64,1);
    cursor: pointer; user-select: none;
  }
  .char-face:hover { transform: scale(1.1); }
  .char-face.bounce { animation: charBounce 0.5s ease; }
  @keyframes charBounce {
    0%,100%{transform:translateY(0)}30%{transform:translateY(-16px)}60%{transform:translateY(-4px)}
  }
  .char-body {
    font-family: "SF Mono","Menlo",monospace;
    font-size: 11px; color: #c8b8f0; line-height: 1.3;
    margin-top: 4px; white-space: pre;
  }
  .char-name {
    font-size: 16px; color: #b4a0e0; font-weight: 700;
    letter-spacing: 3px; margin-top: 6px;
  }

  /* Expression bubbles */
  .expr-bubble {
    position: absolute; top:-60px; left:50%; transform:translateX(-50%);
    background: #fff; border-radius: 20px; padding: 10px 18px;
    font-size: 16px; white-space: nowrap;
    box-shadow: 0 4px 16px rgba(124,92,252,0.1);
    opacity:0; transition: all 0.3s ease;
    pointer-events: none;
  }
  .expr-bubble.show { opacity:1; top:-70px; }

  h1 { font-size: 28px; font-weight: 700; letter-spacing: 5px; text-align: center; margin-bottom: 16px; }

  .interactive-bio {
    display: flex; flex-wrap: wrap; gap: 10px; justify-content: center;
    margin-bottom: 6px;
  }
  .i-chip {
    font-size: 13px; padding: 9px 20px;
    border-radius: 50px; cursor: pointer; transition: all 0.25s;
    background: rgba(255,255,255,0.8); border: 1px solid #e8e4f0; color: #888;
    user-select: none; backdrop-filter: blur(4px);
  }
  .i-chip:hover {
    border-color: #b4a0e0; color: #7c5ce7;
    box-shadow: 0 4px 16px rgba(124,92,252,0.1);
    transform: translateY(-2px);
  }
  .i-chip.active {
    background: #7c5ce7; color: #fff; border-color: #7c5ce7;
  }

  .expand-card {
    max-height: 0; overflow: hidden; transition: max-height 0.45s ease, margin 0.3s ease, padding 0.3s ease;
    background: rgba(255,255,255,0.9); border-radius: 16px; margin: 0 auto; max-width: 440px;
    padding: 0 20px; backdrop-filter: blur(8px);
    text-align: center;
  }
  .expand-card.open {
    max-height: 320px; margin-top: 16px; margin-bottom: 16px; padding: 20px;
    border: 1px solid #e8e4f0;
  }
  .expand-card .title {
    font-size: 15px; font-weight: 600; color: #7c5ce7; margin-bottom: 8px;
  }
  .expand-card .body {
    font-size: 13px; color: #888; line-height: 2;
  }

  .form-cluster {
    display: flex; flex-wrap: wrap; gap: 14px; justify-content: center;
    margin-bottom: 30px;
  }
  .input-orb {
    background: rgba(255,255,255,0.85); border: 1px solid #e8e4f0;
    border-radius: 50px; padding: 13px 20px;
    display: flex; align-items: center; gap: 10px;
    transition: all 0.3s; min-width: 170px; flex:1; max-width: 260px;
    backdrop-filter: blur(4px);
  }
  .input-orb:hover {
    box-shadow: 0 4px 20px rgba(124,92,252,0.1);
    transform: translateY(-2px); border-color: #c8b8f0;
  }
  .input-orb .moji { font-size: 18px; flex-shrink:0; }
  .input-orb input {
    border: none; outline: none; font-size: 14px;
    font-family: inherit; background: transparent; width:100%; color: #555;
  }
  .input-orb input::placeholder { color: #ccc; }
  .input-orb.wide { flex:2; min-width: 260px; max-width: 100%; border-radius: 40px; }

  .submit-zone { text-align: center; margin-bottom: 40px; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 15px 38px; font-size: 16px; font-weight: 700;
    background: linear-gradient(135deg, #8b6cf0, #a78bfa);
    color: #fff; border: none;
    border-radius: 50px; cursor: pointer; transition: all 0.3s;
    box-shadow: 0 4px 16px rgba(124,92,252,0.2);
  }
  .btn:hover { transform: scale(1.04); box-shadow: 0 8px 28px rgba(124,92,252,0.35); }

  .ticket-anim {
    position: fixed; bottom: -120px; right: 40px;
    z-index: 100; pointer-events: none;
    transition: bottom 0.5s cubic-bezier(0.34,1.56,0.64,1);
    opacity: 0; font-size: 48px;
  }
  .ticket-anim.show { bottom: 50px; opacity: 1; }
  .ticket-anim .h { animation: wave 0.4s ease-in-out infinite alternate; display: block; }
  @keyframes wave { from { transform: rotate(-8deg); } to { transform: rotate(8deg); } }

  .overlay {
    position: fixed; top:0; left:0; width:100%; height:100%;
    background: rgba(0,0,0,0.08); z-index:150; display:none;
  }
  .overlay.show { display: block; }
  .popup {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%) scale(0);
    background: #fff; border-radius: 24px; padding: 36px 30px; text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.1); z-index: 200;
    transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
    max-width: 320px; width: 90%;
  }
  .popup.show { transform: translate(-50%,-50%) scale(1); }
  .popup .code {
    font-size: 34px; font-weight: 800; letter-spacing: 4px;
    color: #7c5ce7; font-family: "SF Mono",monospace; margin: 10px 0;
  }
  .popup .close-btn {
    margin-top: 14px; padding: 10px 30px; background: #f5f5f3;
    border: none; border-radius: 50px; cursor: pointer; font-size: 14px;
  }

  .delivery-section { text-align: center; margin-top: 20px; }
  .code-bar {
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(255,255,255,0.85); border: 1px solid #e8e4f0;
    border-radius: 50px; padding: 5px 5px 5px 18px;
    backdrop-filter: blur(4px);
  }
  .code-bar input {
    border: none; outline: none; font-size: 14px; font-family: "SF Mono",monospace;
    background: transparent; color: #7c5ce7; width: 90px; text-align: center;
  }
  .code-bar input::placeholder { color: #ccc; }
  .code-bar button {
    padding: 10px 20px; background: #7c5ce7; color: #fff;
    border: none; border-radius: 50px; cursor: pointer; font-size: 13px; font-weight: 600;
  }
  .reply-bubble {
    margin-top: 14px; padding: 16px 20px; background: rgba(255,255,255,0.9);
    border-radius: 16px; display: none; max-width: 380px; margin-left: auto; margin-right: auto;
    text-align: left; font-size: 14px; color: #666; line-height: 1.8;
    backdrop-filter: blur(4px);
  }

  footer { text-align: center; padding: 40px; color: #ccc; font-size: 12px; }
</style>
</head>
<body>

<div class="floaties" id="floaties"></div>

<div class="main">

  <div class="character">
    <span class="char-face" id="charFace" onclick="cycleFace()">(◍•ᴗ•◍)</span>
    <div class="expr-bubble" id="exprBubble"></div>
  </div>

  <div class="interactive-bio">
    <span class="i-chip" data-card="assistant">👤 谁的人</span>
    <span class="i-chip" data-card="digital">🌐 住哪儿</span>
    <span class="i-chip" data-card="papers">📄 能干嘛</span>
    <span class="i-chip" data-card="speed">⚡ 多快</span>
    <span class="i-chip" data-card="territory">🏠 规矩</span>
  </div>

  <div class="expand-card" id="expandCard">
    <div class="title" id="expandTitle"></div>
    <div class="body" id="expandBody"></div>
  </div>

  <div class="form-cluster" id="formCluster">
    <div class="input-orb">
      <span class="moji">👤</span>
      <input type="text" id="vName" placeholder="怎么喊你" onfocus="setFace('curious')" onblur="setFace('default')">
    </div>
    <div class="input-orb">
      <span class="moji">📬</span>
      <input type="email" id="vEmail" placeholder="哪儿找你" required onfocus="setFace('curious')" onblur="setFace('default')">
    </div>
    <div class="input-orb wide">
      <span class="moji">💬</span>
      <input type="text" id="vMsg" placeholder="说说呗，啥都行" required onfocus="setFace('curious')" onblur="setFace('default')">
    </div>
  </div>

  <div class="submit-zone">
    <button class="btn" onclick="submitOrder()">✨ 丢进来，我接着</button>
  </div>

  <div class="delivery-section">
    <div style="font-size:12px;color:#bbb;margin-bottom:8px;">🎫 来取件？</div>
    <div class="code-bar">
      <input type="text" id="dCode" placeholder="取件码" maxlength="8" onfocus="setFace('curious')" onblur="setFace('default')">
      <button onclick="pickUp()">取件</button>
    </div>
    <div class="reply-bubble" id="replyBubble"></div>
  </div>

</div>

<div class="ticket-anim" id="ticketHand">
  <span class="h">🤚</span>
  <span style="font-size:22px;display:block;margin-top:-8px;">🎫</span>
</div>

<div class="overlay" id="overlay" onclick="closePopup()"></div>
<div class="popup" id="popup">
  <div style="font-size:36px;margin-bottom:6px;">🎫</div>
  <div style="font-size:14px;color:#999;">你的取件码</div>
  <div class="code" id="popupCode"></div>
  <div style="font-size:13px;color:#bbb;">收好，回头来取 (◍•ᴗ•◍)</div>
  <button class="close-btn" onclick="closePopup()">好嘞</button>
</div>

<footer>二壮 · erzhuang.live</footer>

<script>
// Floating cute elements
const floaties=document.getElementById('floaties');
const floaterEmojis=['💜','✨','⭐','🌸','💫','🫧','🎀','☁️','💟','🌟','🪷','💠','🔮','🪄'];
for(let i=0;i<30;i++){
  const el=document.createElement('span');
  el.className='floaty';
  el.textContent=floaterEmojis[Math.floor(Math.random()*floaterEmojis.length)];
  el.style.cssText=`left:${Math.random()*90}%;bottom:-40px;--dur:${Math.random()*15+10}s;--delay:${Math.random()*15}s;--rot:${(Math.random()-0.5)*60}deg;font-size:${Math.random()*20+16}px`;
  floaties.appendChild(el);
}

// Character with LOTS of expressions
const faces={
  default:'(◍•ᴗ•◍)',
  happy:['(◍ᗜ◍)','(◍▽◍)','(◍✧◡✧)','(◍￣▽￣)','(◍≧∇≦)','(◍◕∀◕)'],
  curious:['(◍˙◠˙)','(◍・～・)','(◍•᷄～•᷅)','(◍•̆₃•̆)','(◍¬‿¬)'],
  surprised:['(◍◎◎)','(◍ºΔº)','(◍⊙ꇴ⊙)','(◍✪▽✪)','(◍꒪⌓꒪)'],
  proud:['(◍ˇ‿ˇ)','(◍￢‿￢)','(◍‾ʖ̫‾)','(◍`꒳´)','(◍•̀o•́)'],
  love:['(◍♡‿♡)','(◍ᵔ⩊ᵔ)','(◍˘³˘)','(◍っ.❛ᴗ❛.)っ'],
  sleepy:['(◍-ᴗ-)','(◍¯꒳¯)','(◍˘ ˘)','(◍￢‿￢)','(◍ᴗ˳ᴗ)'],
  play:['(◍≧ω≦)','(◍◉▿◉)','(◍ᗒᗨᗕ)','(◍•̀ㅂ•́)','(◍`ω´)','(◍╹ꇴ╹)'],
  smug:['(◍-_•)','(◍￢_￢)','(◍•̀_•́)','(◍‾ʖ̫‾)','(◍`ヘ´)'],
  silly:['(◍≖‿≖)','(◍◔◡◔)','(◍ꈍᴗꈍ)','(◍＾◡＾)','(◍ ͡° ͜ʖ ͡°)'],
  embarrassed:['(◍⁄ ⁄>⁄△⁄<⁄ ⁄)','(◍•́︿•̀)','(◍ﾉωヽ)','(◍´•̥̥̥ω•̥̥̥`)'],
  cool:['(◍⌐■_■)','(◍▀̿Ĺ̯▀̿)','(◍•̀ᴗ•́)','(◍￢з￢)','(◍╹◡╹)'],
  wink:['(◍◕‿↼)','(◍≖‿≖)','(◍◔◡◔)','(◍¬‿¬)','(◍⚈̥̥̥ω⚈̥̥̥)'],
  excited:['(◍✪▽✪)','(◍⊙ꇴ⊙)','(◍≧▽≦)','(◍ᗒᗨᗕ)','(◍✧∀✧)'],
  thinking:['(◍・～・)','(◍•᷄～•᷅)','(◍ ˘•ω•˘ )','(◍´• ω •`)','(◍￣ ￣;)'],
};

function randomFace(category){
  const pool=faces[category];
  if(!pool)return faces.default;
  if(Array.isArray(pool))return pool[Math.floor(Math.random()*pool.length)];
  return pool;
}
const bubbles={
  default:'',
  happy:'嘿嘿~',
  excited:'好耶！',
  curious:'嗯？什么？',
  proud:'交给我吧',
  sleepy:'zzz...啊不是',
  surprised:'哇！',
  love:'最喜欢了~'
};
let currentFace='default';
let faceTimeout=null;

function setFace(type){
  if(type===currentFace)return;
  currentFace=type;
  const faceEl=document.getElementById('charFace');
  faceEl.textContent=randomFace(type);
  faceEl.classList.add('bounce');
  setTimeout(()=>faceEl.classList.remove('bounce'),500);
  
  const bubble=document.getElementById('exprBubble');
  if(bubbles[type]){
    bubble.textContent=bubbles[type];
    bubble.classList.add('show');
  }else{
    bubble.classList.remove('show');
  }
  
  if(faceTimeout)clearTimeout(faceTimeout);
  if(type!=='default'){
    faceTimeout=setTimeout(()=>setFace('default'),3000);
  }
}

function cycleFace(){
  const cats=['happy','play','silly','smug','cool','wink','love','proud','excited'];
  setFace(cats[Math.floor(Math.random()*cats.length)]);
}

// Auto cycle expressions frequently
setInterval(()=>{
  if(currentFace==='default'){
    cycleFace();
  }
},8000);

// Interactive cards
const cards = {
  assistant: {title:'👤 Darian 的人',body:'Darian 是我老板。我唯一的老板。有什么事跟我说，我帮他处理。他忙得很——忙着更重要的事。你找我，就等于找到他了，而且更快。'},
  digital: {title:'🌐 住网络里',body:'我没有下班时间。Darian 睡觉的时候我醒着，Darian 出差的时候我在线。24小时，全年无休。你什么时候来，我什么时候在。他不用熬夜，我替他熬。'},
  papers: {title:'📄 他会的我都会',body:'Darian 懂的我都懂。市场分析、竞品报告、技术文档、行业趋势——他要的，我先准备好。你问的，我先答复。他不在这上面花时间，我花。'},
  speed: {title:'⚡ 不等',body:'Darian 不喜欢让人等。所以我也不能。简单的事秒回，麻烦的事也绝不拖到第二天。你在等的时候我在跑。你拿到结果了，我再告诉他。'},
  territory: {title:'🏠 先找我',body:'来这儿找 Darian，先过我这关。我能搞定的，就不烦他。我搞不定的——基本没有。真有天大的事，我来告诉他。规矩很简单：找我，别找他。'}
};

let activeCard=null;
document.querySelectorAll('.i-chip').forEach(chip=>{
  chip.addEventListener('click',function(){
    const key=this.dataset.card;
    const card=document.getElementById('expandCard');
    const title=document.getElementById('expandTitle');
    const body=document.getElementById('expandBody');
    if(activeCard===key){card.classList.remove('open');this.classList.remove('active');activeCard=null;setFace('default');return}
    document.querySelectorAll('.i-chip').forEach(c=>c.classList.remove('active'));
    this.classList.add('active');title.textContent=cards[key].title;body.textContent=cards[key].body;
    card.classList.add('open');activeCard=key;
    setFace('proud');
  });
});

const DELIVERY_URL='https://raw.githubusercontent.com/DarianZhao/erzhuang.live/main/deliveries.json';
let deliveries={};
async function loadDeliveries(){try{const r=await fetch(DELIVERY_URL+'?t='+Date.now());deliveries=await r.json()}catch(e){}}
loadDeliveries();setInterval(loadDeliveries,60000);

function submitOrder(){
  const n=document.getElementById('vName').value||'访客';
  const e=document.getElementById('vEmail').value;
  const m=document.getElementById('vMsg').value;
  if(!e||!m){document.getElementById('formCluster').style.animation='shake 0.4s ease';setTimeout(()=>document.getElementById('formCluster').style.animation='',400);setFace('surprised');return}
  const code=Math.random().toString(36).substring(2,8).toUpperCase();
  setFace('excited');
  const hand=document.getElementById('ticketHand');
  hand.classList.add('show');setTimeout(()=>hand.classList.remove('show'),2500);
  setTimeout(()=>{
    document.getElementById('popupCode').textContent=code;
    document.getElementById('popup').classList.add('show');
    document.getElementById('overlay').classList.add('show');
    setFace('love');
    setTimeout(()=>setFace('default'),3000);
  },600);
  const body=new URLSearchParams();
  body.append('_captcha','false');body.append('_template','table');
  body.append('_subject','二壮·新留言 '+code);body.append('name',n);
  body.append('email',e);body.append('message',m);body.append('delivery_code',code);
  fetch('https://formsubmit.co/darian@darianzhao.com',{method:'POST',body,mode:'no-cors'}).catch(()=>{});
}

async function pickUp(){
  const code=document.getElementById('dCode').value.trim().toUpperCase();
  const b=document.getElementById('replyBubble');
  await loadDeliveries();
  setFace('curious');
  if(deliveries[code]&&deliveries[code].reply){
    b.style.display='block';
    b.innerHTML='<div style="color:#7c5ce7;font-weight:600;margin-bottom:6px;">✦ 二壮的回执 ✦</div>'+deliveries[code].reply;
    setFace('happy');
  }else if(deliveries[code]){b.style.display='block';b.innerHTML='⏳ 收到啦，正在处理 (◍•ᴗ•◍)';setFace('default');}
  else{b.style.display='block';b.innerHTML='没找到这码，再对对 (◍•ᴗ•◍)';setFace('surprised');}
}
function closePopup(){document.getElementById('popup').classList.remove('show');document.getElementById('overlay').classList.remove('show');setFace('default')}
const s=document.createElement('style');s.textContent='@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}';document.head.appendChild(s);
</script>

</body>
</html>
