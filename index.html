*{margin:0;padding:0;box-sizing:border-box}

.box{background:rgba(20,20,40,0.8);border:1px solid rgba(100,100,180,0.15);border-radius:20px;padding:44px 32px;max-width:400px;width:100%;text-align:center;backdrop-filter:blur(10px)}

input:focus{border-color:#7c5cfc;box-shadow:0 0 12px rgba(124,92,252,0.15)}
input::placeholder{color:#555}
button{width:100%;padding:13px;background:linear-gradient(135deg,#6c4ce0,#8b6cf0);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer}
button:hover{box-shadow:0 0 24px rgba(124,92,252,0.4)}
.hint{font-size:12px;color:#555;margin-top:22px}
.err{color:#e74c3c;font-size:13px;margin-top:6px;display:none}
</style>
